[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-scratchpad-lru"
version = "0.1.0"
description = "In-memory volatile scratchpad with priority tagging and automatic pruning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-scratchpad-lru = "agent_scratchpad_lru.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_scratchpad_lru*"]
